<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Claude Remote PC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Not configured</span>
    </div>
    <div class="titlebar-right">
      <button id="btn-start" class="btn btn-primary">Start PC</button>
      <button id="btn-stop" class="btn btn-danger" hidden>Stop PC</button>
      <button id="btn-settings" class="btn btn-ghost" title="Settings">⚙</button>
    </div>
  </div>

  <div class="main">
    <div class="screen-pane">
      <div id="screen-placeholder" class="screen-placeholder">
        <div>
          <div class="placeholder-title">No active session</div>
          <div class="placeholder-sub">Click "Start PC" to spin up a disposable desktop.</div>
        </div>
      </div>
      <webview id="screen-view" hidden></webview>
    </div>

    <div class="chat-pane">
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Tell Claude what to do..." rows="2" disabled></textarea>
        <button id="btn-send" class="btn btn-primary" disabled>Send</button>
      </div>
    </div>
  </div>

  <div id="settings-overlay" class="overlay" hidden>
    <div class="settings-modal">
      <h2>Settings</h2>
      <label>GitHub repo (owner/name)</label>
      <input id="input-repo" type="text" placeholder="owennnlol/claude-remote-pc" />

      <label>Control token</label>
      <input id="input-token" type="password" placeholder="the CONTROL_TOKEN secret's value" />

      <label>VNC password <span class="hint">(reference only — you'll still type it into the embedded view)</span></label>
      <input id="input-vnc" type="password" placeholder="the VNC_PASSWORD secret's value" />

      <div id="gh-status" class="gh-status"></div>

      <div class="settings-actions">
        <button id="btn-settings-cancel" class="btn btn-ghost">Cancel</button>
        <button id="btn-settings-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
