                - superscript [ref=f1e546]:
                  - link "[66]" [ref=f1e547] [cursor=pointer]:
                    - /url: "#cite_note-Octodex_FAQ-66"
                - text: Later, GitHub hired illustrator Cameron McEfee to adapt Octocat for different purposes on the website and promotional materials; McEfee and various GitHub users have since created hundreds of variations of the character, which are available on
                - link "The Octodex" [ref=f1e548] [cursor=pointer]:
