                    - /url: "#cite_note-atlassian-10reasons-55"
                - superscript [ref=f1e496]:
                  - link "[56]" [ref=f1e497] [cursor=pointer]:
                    - /url: "#cite_note-zdnet-rivalsgain-56"
                - superscript [ref=f1e498]:
                  - link "[57]" [ref=f1e499] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - superscript [ref=f1e500]:
                  - link "[58]" [ref=f1e501] [cursor=pointer]:
                    - /url: "#cite_note-58"
                - superscript [ref=f1e502]:
                  - link "[59]" [ref=f1e503] [cursor=pointer]:
                    - /url: "#cite_note-59"
              - paragraph [ref=f1e504]:
                - text: In September 2019, GitHub acquired
                - link "Semmle" [ref=f1e505] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Semmle
                - text: ", a code analysis tool."
                - superscript [ref=f1e506]:
                  - link "[60]" [ref=f1e507] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - text: In February 2020, GitHub launched in India under the name GitHub India Private Limited.
                - superscript [ref=f1e508]:
                  - link "[61]" [ref=f1e509] [cursor=pointer]:
                    - /url: "#cite_note-61"
                - text: In March 2020, GitHub announced that it was acquiring
                - link "npm" [ref=f1e510] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Npm_(software)
                - text: ", a JavaScript packaging vendor, for an undisclosed sum of money."
                - superscript [ref=f1e511]:
                  - link "[62]" [ref=f1e512] [cursor=pointer]:
                    - /url: "#cite_note-62"
                - text: The deal was closed on April 15, 2020.
                - superscript [ref=f1e513]:
                  - link "[63]" [ref=f1e514] [cursor=pointer]:
                    - /url: "#cite_note-63"
              - paragraph [ref=f1e515]:
                - text: In early July 2020, the GitHub Archive Program was established to archive its open-source code in perpetuity.
                - superscript [ref=f1e516]:
                  - link "[64]" [ref=f1e517] [cursor=pointer]:
                    - /url: "#cite_note-blog-64"
            - region [ref=f1e518]:
              - generic [ref=f1e519]:
                - heading "Mascot" [level=3] [ref=f1e520]
