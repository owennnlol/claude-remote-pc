            - paragraph [ref=f1e247]:
              - text: GitHub (
              - generic [ref=f1e248]:
                - link /ˈɡɪt.hʌb/ [ref=f1e250] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Help:IPA/English
                  - text: /
                  - generic [ref=f1e251]: ˈɡɪt.hʌb
                  - text: /
                - generic [ref=f1e252]:
                  - button "Play audio" [ref=f1e254] [cursor=pointer]
                  - superscript [ref=f1e256]:
                    - link "ⓘ" [ref=f1e257] [cursor=pointer]:
                      - /url: /wiki/File:En-us-GitHub.ogg
              - text: ) is a
              - link "proprietary" [ref=f1e258] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Proprietary_software
              - text: developer platform that allows developers to create, store, manage, and share their code. It uses
              - link "Git" [ref=f1e259] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Git
              - text: to provide
              - link "distributed version control" [ref=f1e260] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Distributed_version_control
              - text: ", and GitHub itself provides"
              - link "access control" [ref=f1e261] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Access_control
              - text: ","
              - link "bug tracking" [ref=f1e262] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bug_tracking_system
              - text: ","
              - link "software feature" [ref=f1e263] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Software_feature
              - text: requests,
              - link "task management" [ref=f1e264] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Task_management
              - text: ","
              - link "continuous integration" [ref=f1e265] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Continuous_integration
              - text: ", and"
              - link "wikis" [ref=f1e266] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Wiki
              - text: for every project.
              - superscript [ref=f1e267]:
                - link "[9]" [ref=f1e268] [cursor=pointer]:
                  - /url: "#cite_note-hugeinvestment-9"
              - text: GitHub, headquartered in
              - link "San Francisco" [ref=f1e269] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/San_Francisco
              - text: ", is operated by Github, Inc., a subsidiary of"
              - link "Microsoft" [ref=f1e270] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft
              - text: since 2018.
              - superscript [ref=f1e271]:
                - link "[10]" [ref=f1e272] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-10"
            - paragraph [ref=f1e273]:
              - text: It is commonly used to host
              - link "open source" [ref=f1e274] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Open_source
              - text: software development projects.
              - superscript [ref=f1e275]:
                - link "[11]" [ref=f1e276] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - text: As of January 2023, GitHub reported having over 100 million developers and more than 420 million
              - link "repositories" [ref=f1e277] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Repository_(version_control)
              - text: ", including at least 28 million public repositories."
              - superscript [ref=f1e278]:
                - link "[12]" [ref=f1e279] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - text: It is the world's largest
              - link "source code" [ref=f1e280] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Source_code
              - text: host as of June 2023. Over five billion developer contributions were made to more than 500 million open source projects in 2024.
              - superscript [ref=f1e281]:
                - link "[13]" [ref=f1e282] [cursor=pointer]:
                  - /url: "#cite_note-13"
          - region [ref=f1e283]:
            - generic [ref=f1e284]:
              - heading "About" [level=2] [ref=f1e285]
              - generic [ref=f1e286]:
                - link "edit":
                  - /url: /w/index.php?title=GitHub&action=edit&section=1
            - region [ref=f1e287]:
              - generic [ref=f1e288]:
                - heading "Founding" [level=3] [ref=f1e289]
                - generic [ref=f1e290]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=2
              - paragraph [ref=f1e291]:
                - text: The development of the GitHub platform began on October 19, 2007.
                - superscript [ref=f1e292]:
                  - link "[14]" [ref=f1e293] [cursor=pointer]:
                    - /url: "#cite_note-githubfirstcommit-14"
                - text: The site was launched in April 2008 by
                - link "Tom Preston-Werner" [ref=f1e294] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tom_Preston-Werner
                - text: ","
                - link "Chris Wanstrath" [ref=f1e295] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chris_Wanstrath
                - text: ","
                - link "P. J. Hyett" [ref=f1e296] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/P._J._Hyett
                - text: ", and Scott Chacon after it had been available for a few months as a"
                - link "beta release" [ref=f1e297] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Beta_release
                - text: .
                - superscript [ref=f1e298]:
                  - link "[15]" [ref=f1e299] [cursor=pointer]:
                    - /url: "#cite_note-pastie-15"
            - region [ref=f1e300]:
              - generic [ref=f1e301]:
                - heading "Structure of the organization" [level=3] [ref=f1e302]
                - generic [ref=f1e303]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=3
              - paragraph [ref=f1e304]:
                - text: GitHub was originally a
                - link "flat organization" [ref=f1e305] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Flat_organization
                - text: with no middle managers, instead relying on
                - link "self-management" [ref=f1e306] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Workers'_self-management
                - text: .
                - superscript [ref=f1e307]:
                  - link "[16]" [ref=f1e308] [cursor=pointer]:
                    - /url: "#cite_note-cto-mgmt-style-16"
                - text: Employees could choose to work on projects that interested them (
                - link "open allocation" [ref=f1e309] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Open_allocation
                - text: ), but the chief executive set salaries.
                - superscript [ref=f1e310]:
                  - link "[17]" [ref=f1e311] [cursor=pointer]:
                    - /url: "#cite_note-nyt-17"
              - paragraph [ref=f1e312]:
                - text: In 2014, the company added a layer of
                - link "middle management" [ref=f1e313] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Middle_management
                - text: in response to harassment allegations against its co-founder and then-CEO, Thomas Preston-Werner, and his wife Theresa. As a result of the scandal, Preston-Werner resigned from his position as CEO.
                - superscript [ref=f1e314]:
                  - link "[18]" [ref=f1e315] [cursor=pointer]:
                    - /url: "#cite_note-wsj-2014-18"
                - text: Co-founder and product lead,
                - link "Chris Wanstrath" [ref=f1e316] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chris_Wanstrath
                - text: ", became CEO."
                - link "Julio Avalos" [ref=f1e317] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Julio_Avalos
                - text: ", then general counsel and administrative officer, assumed control over GitHub's business operations and day-to-day management."
                - superscript [ref=f1e318]:
                  - link "[19]" [ref=f1e319] [cursor=pointer]:
                    - /url: "#cite_note-19"
            - region [ref=f1e320]:
              - generic [ref=f1e321]:
                - heading "Finance" [level=3] [ref=f1e322]
                - generic [ref=f1e323]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=4
              - paragraph [ref=f1e324]:
                - text: GitHub was a
                - link "bootstrapped" [ref=f1e325] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Entrepreneurship#Bootstrapping
                - link "start-up business" [ref=f1e326] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Startup_company
                - text: ", which in its first years provided enough revenue to be funded solely by its three founders and start taking on employees."
                - superscript [ref=f1e327]:
                  - link "[20]" [ref=f1e328] [cursor=pointer]:
                    - /url: "#cite_note-20"
              - paragraph [ref=f1e329]:
                - text: In July 2012, four years after the company was founded,
                - link "Andreessen Horowitz" [ref=f1e330] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andreessen_Horowitz
                - text: invested $100 million in
                - link "venture capital" [ref=f1e331] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Venture_capital
                - superscript [ref=f1e332]:
                  - link "[9]" [ref=f1e333] [cursor=pointer]:
                    - /url: "#cite_note-hugeinvestment-9"
                - text: with a $750 million valuation.
                - superscript [ref=f1e334]:
                  - link "[21]" [ref=f1e335] [cursor=pointer]:
                    - /url: "#cite_note-21"
              - paragraph [ref=f1e336]:
                - text: In July 2015 GitHub raised another $250 million (~$322 million in 2024) of venture capital in a
                - link "series B round" [ref=f1e337] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Series_B
                - text: . The lead investor was
                - link "Sequoia Capital" [ref=f1e338] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sequoia_Capital
                - text: ", and other investors were"
                - link "Andreessen Horowitz" [ref=f1e339] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andreessen_Horowitz
                - text: ","
                - link "Thrive Capital" [ref=f1e340] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thrive_Capital
                - text: ", IVP (Institutional Venture Partners), and other venture capital funds."
                - superscript [ref=f1e341]:
                  - link "[22]" [ref=f1e342] [cursor=pointer]:
                    - /url: "#cite_note-22"
                - superscript [ref=f1e343]:
                  - link "[23]" [ref=f1e344] [cursor=pointer]:
                    - /url: "#cite_note-23"
                - text: The company was then valued at approximately $2 billion.
                - superscript [ref=f1e345]:
                  - link "[24]" [ref=f1e346] [cursor=pointer]:
                    - /url: "#cite_note-24"
              - paragraph [ref=f1e347]:
                - text: As of 2023, GitHub was estimated to generate $1 billion in revenue annually.
                - superscript [ref=f1e348]:
                  - link "[2]" [ref=f1e349] [cursor=pointer]:
                    - /url: "#cite_note-techcrunch.com-2"
            - region [ref=f1e350]:
              - generic [ref=f1e351]:
                - heading "History" [level=3] [ref=f1e352]
                - generic [ref=f1e353]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=5
              - paragraph [ref=f1e354]:
                - text: The GitHub service was developed by
                - link "Chris Wanstrath" [ref=f1e355] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chris_Wanstrath
                - text: ","
                - link "P. J. Hyett" [ref=f1e356] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/P._J._Hyett
                - text: ","
                - link "Tom Preston-Werner" [ref=f1e357] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tom_Preston-Werner
                - text: ", and Scott Chacon using"
                - link "Ruby on Rails" [ref=f1e358] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ruby_on_Rails
                - text: ", and started in February 2008."
                - superscript [ref=f1e359]:
                  - link "[25]" [ref=f1e360] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - text: The company, GitHub, Inc., was formed in 2007 and is located in San Francisco.
                - superscript [ref=f1e361]:
                  - link "[26]" [ref=f1e362] [cursor=pointer]:
                    - /url: "#cite_note-26"
              - figure "GitHub at AWS Summit" [ref=f1e363]:
                - link [ref=f1e364] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:GithubAWSTorontoSummit.jpg
              - figure [ref=f1e367]:
                - link [ref=f1e368] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Mapping_collaborative_software_on_GitHub.png
                - generic [ref=f1e370]:
                  - text: The shading of the map illustrates the number of users as a proportion of each country's
                  - link "Internet population" [ref=f1e371] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Internet_population
                  - text: . The circular charts surrounding the two hemispheres depict the total number of GitHub users (left) and commits (right) per country.
              - paragraph [ref=f1e372]:
                - text: On February 24, 2009, GitHub announced that within the first year of being online, GitHub had accumulated over 46,000 public repositories, 17,000 of which were formed in the previous month.
                - superscript [ref=f1e373]:
                  - link "[27]" [ref=f1e374] [cursor=pointer]:
                    - /url: "#cite_note-:2-27"
                - text: At that time, about 6,200 repositories had been
                - link "forked" [ref=f1e375] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fork_(software_development)
                - text: at least once, and 4,600 had been merged.
                - superscript [ref=f1e376]:
                  - link "[27]" [ref=f1e377] [cursor=pointer]:
                    - /url: "#cite_note-:2-27"
              - paragraph [ref=f1e378]:
                - text: That same year, the site was used by over 100,000 users, according to GitHub,
                - superscript [ref=f1e379]:
                  - link "[28]" [ref=f1e380] [cursor=pointer]:
                    - /url: "#cite_note-28"
                - text: and had grown to host 90,000 unique public repositories, 12,000 having been forked at least once, for a total of 135,000 repositories.
                - superscript [ref=f1e381]:
                  - link "[29]" [ref=f1e382] [cursor=pointer]:
                    - /url: "#cite_note-29"
              - paragraph [ref=f1e383]:
                - text: In 2010, GitHub was hosting 1 million repositories.
                - superscript [ref=f1e384]:
                  - link "[30]" [ref=f1e385] [cursor=pointer]:
                    - /url: "#cite_note-30"
                - text: A year later, this number doubled.
                - superscript [ref=f1e386]:
                  - link "[31]" [ref=f1e387] [cursor=pointer]:
                    - /url: "#cite_note-31"
                - link "ReadWriteWeb" [ref=f1e388] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ReadWriteWeb
                - text: reported that GitHub had surpassed
                - link "SourceForge" [ref=f1e389] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SourceForge
                - text: and
                - link "Google Code" [ref=f1e390] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Code
                - text: in total number of commits for the period of January to May 2011.
                - superscript [ref=f1e391]:
                  - link "[32]" [ref=f1e392] [cursor=pointer]:
                    - /url: "#cite_note-32"
                - text: On January 16, 2013, GitHub passed the 3 million users mark and was then hosting more than 5 million repositories.
                - superscript [ref=f1e393]:
                  - link "[33]" [ref=f1e394] [cursor=pointer]:
                    - /url: "#cite_note-33"
                - text: By the end of the year, the number of repositories was twice as great, reaching 10 million repositories.
                - superscript [ref=f1e395]:
                  - link "[34]" [ref=f1e396] [cursor=pointer]:
                    - /url: "#cite_note-34"
              - paragraph [ref=f1e397]:
                - text: In 2015, GitHub opened an office in Japan, its first outside of the U.S.
                - superscript [ref=f1e398]:
                  - link "[35]" [ref=f1e399] [cursor=pointer]:
                    - /url: "#cite_note-35"
              - paragraph [ref=f1e400]:
                - text: On February 28, 2018, GitHub fell victim to the third-largest
                - link "distributed denial-of-service" [ref=f1e401] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Distributed_denial-of-service
                - text: (DDoS) attack in history, with incoming traffic reaching a peak of about 1.35 terabits per second.
                - superscript [ref=f1e402]:
                  - link "[36]" [ref=f1e403] [cursor=pointer]:
                    - /url: "#cite_note-DDOS-36"
              - paragraph [ref=f1e404]:
                - text: On June 19, 2018, GitHub expanded its GitHub Education by offering free education bundles to all schools.
                - superscript [ref=f1e405]:
                  - link "[37]" [ref=f1e406] [cursor=pointer]:
                    - /url: "#cite_note-37"
                - superscript [ref=f1e407]:
                  - link "[38]" [ref=f1e408] [cursor=pointer]:
                    - /url: "#cite_note-38"
              - paragraph [ref=f1e409]:
                - text: On June 11, 2019, it was announced that former
                - link "Bitnami" [ref=f1e410] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bitnami
                - text: chief operating officer (COO) and co-founder, Erica Brescia, would be GitHub's COO.
                - superscript [ref=f1e411]:
                  - link "[39]" [ref=f1e412] [cursor=pointer]:
                    - /url: "#cite_note-39"
              - paragraph [ref=f1e413]:
                - text: On November 3, 2021, GitHub announced that CEO
                - link "Nat Friedman" [ref=f1e414] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nat_Friedman
                - text: ", who became CEO when Microsoft acquired GitHub, was stepping down as CEO and GitHub's chief product officer,"
                - link "Thomas Dohmke" [ref=f1e415] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thomas_Dohmke
                - text: ", would become CEO on November 15."
                - superscript [ref=f1e416]:
                  - link "[40]" [ref=f1e417] [cursor=pointer]:
                    - /url: "#cite_note-40"
              - paragraph [ref=f1e418]:
                - text: In June 2025, the amount of repositories on GitHub surpassed one billion. Notably, the billionth repository contained nothing but the word "
                - link "shit" [ref=f1e419] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Shit
                - text: "\"."
                - superscript [ref=f1e420]:
                  - link "[41]" [ref=f1e421] [cursor=pointer]:
                    - /url: "#cite_note-41"
              - paragraph [ref=f1e422]:
                - text: On August 11, 2025
                - link "Thomas Dohmke" [ref=f1e423] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thomas_Dohmke
                - text: announced that he was to step down as CEO at the end of 2025, to pursue entrepreneurial endeavors; Microsoft did not immediately share its intention to find a direct replacement.
                - superscript [ref=f1e424]:
                  - link "[42]" [ref=f1e425] [cursor=pointer]:
                    - /url: "#cite_note-42"
            - region [ref=f1e426]:
              - generic [ref=f1e427]:
                - heading "Acquisition by Microsoft" [level=3] [ref=f1e428]
                - generic [ref=f1e429]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=6
              - figure [ref=f1e430]:
                - link [ref=f1e431] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Number_of_open_source_contributors_by_company.png
                - generic [ref=f1e433]:
                  - text: Microsoft was on top of the list of the ten organizations with the most open-source contributors on GitHub in 2016.
                  - superscript [ref=f1e434]:
                    - link "[43]" [ref=f1e435] [cursor=pointer]:
                      - /url: "#cite_note-43"
              - paragraph [ref=f1e436]:
                - text: From 2012,
                - link "Microsoft" [ref=f1e437] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft
                - text: became a significant user of GitHub, using it to host open-source projects and development tools such as
                - link ".NET Core" [ref=f1e438] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/.NET
                - text: ","
                - link "Chakra Core" [ref=f1e439] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chakra_(JavaScript_engine)
                - text: ","
                - link "MSBuild" [ref=f1e440] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/MSBuild
                - text: ","
                - link "PowerShell" [ref=f1e441] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PowerShell
                - text: ","
                - link "PowerToys" [ref=f1e442] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_PowerToys
                - text: ","
                - link "Visual Studio Code" [ref=f1e443] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Visual_Studio_Code
                - text: ","
                - link "Windows Calculator" [ref=f1e444] [cursor=pointer]:
