            - paragraph [ref=f1e557]:
              - text: Projects on GitHub can be accessed and managed using the standard
              - link "Git" [ref=f1e558] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Git
              - text: command-line interface; all standard Git commands work with it. GitHub also allows users to browse public
              - link "repositories" [ref=f1e559] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Content_repository
              - text: on the site. Multiple desktop clients and Git
              - link "plugins" [ref=f1e560] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Plug-in_(computing)
              - text: are also available. In addition, the site provides
              - link "social networking" [ref=f1e561] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Social_networking
              - text: "-like functions such as feeds, followers, wikis (using"
              - link "wiki software" [ref=f1e562] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Wiki_software
              - text: called
              - link "Gollum" [ref=f1e563] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gollum_Wiki
              - text: ), and a
              - link "social network graph" [ref=f1e564] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Collaboration_graph
              - text: to display how developers work on their versions ("
              - link "forks" [ref=f1e565] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fork_(software_development)
              - text: "\") of a repository and what fork (and branch within that fork) is newest."
            - paragraph [ref=f1e566]:
              - text: Anyone can browse and download public repositories, but only registered users can contribute content to repositories. With a registered user account, users can have discussions, manage repositories, submit contributions to others' repositories, and
              - link "review changes to code" [ref=f1e567] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Code_review
              - text: . GitHub began offering limited private repositories at no cost in January 2019 (limited to three contributors per project). Previously, only public repositories were free.
              - superscript [ref=f1e568]:
                - link "[71]" [ref=f1e569] [cursor=pointer]:
                  - /url: "#cite_note-71"
              - superscript [ref=f1e570]:
                - link "[72]" [ref=f1e571] [cursor=pointer]:
                  - /url: "#cite_note-72"
              - superscript [ref=f1e572]:
                - link "[73]" [ref=f1e573] [cursor=pointer]:
                  - /url: "#cite_note-:3-73"
              - text: On April 14, 2020, GitHub made "all of the core GitHub features" free for everyone, including "private repositories with unlimited collaborators."
              - superscript [ref=f1e574]:
                - link "[74]" [ref=f1e575] [cursor=pointer]:
                  - /url: "#cite_note-74"
              - text: In May 2019 Github, Inc. began encrypting source code on github.com by default.
              - superscript [ref=f1e576]:
                - link "[75]" [ref=f1e577] [cursor=pointer]:
                  - /url: "#cite_note-75"
            - paragraph [ref=f1e578]:
              - text: The fundamental software that underpins GitHub is
              - link "Git" [ref=f1e579] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Git
              - text: ", written by"
              - link "Linus Torvalds" [ref=f1e580] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Linus_Torvalds
              - text: ", creator of Linux. The additional software that provides the GitHub user interface was written using"
              - link "Ruby on Rails" [ref=f1e581] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ruby_on_Rails
              - text: and
              - link "Erlang" [ref=f1e582] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Erlang_(programming_language)
              - text: by GitHub, Inc. developers Wanstrath,
              - superscript [ref=f1e583]:
                - link "[76]" [ref=f1e584] [cursor=pointer]:
                  - /url: "#cite_note-wanstrathinterview-76"
              - text: Hyett, and Preston-Werner.
            - region [ref=f1e585]:
              - generic [ref=f1e586]:
                - heading "Scope" [level=3] [ref=f1e587]
                - generic [ref=f1e588]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=9
              - paragraph [ref=f1e589]:
                - text: The primary purpose of GitHub is to facilitate the
                - link "version control" [ref=f1e590] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Version_control
                - text: and
                - link "issue tracking" [ref=f1e591] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Issue_tracking_system
                - text: aspects of software development. Labels, milestones, responsibility assignment, and a search engine are available for issue tracking. For version control, Git (and, by extension, GitHub) allows
                - link "pull requests" [ref=f1e592] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pull_request
                - text: to propose changes to the source code. Users who can review the proposed changes can see a diff between the requested changes and approve them. In Git terminology, this action is called "committing" and one instance of it is a "commit." A history of all commits is kept and can be viewed at a later time.
              - paragraph [ref=f1e593]: "In addition, GitHub supports the following formats and features:"
              - list [ref=f1e594]:
                - listitem [ref=f1e595]:
                  - text: Documentation,
                  - superscript [ref=f1e596]:
                    - link "[77]" [ref=f1e597] [cursor=pointer]:
                      - /url: "#cite_note-77"
                  - text: including automatically rendered
                  - link "README" [ref=f1e598] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/README
                  - text: files in a variety of
                  - link "Markdown" [ref=f1e599] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Markdown
                  - text: "-like file formats (see"
                  - link "README § On GitHub" [ref=f1e600] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/README#On_GitHub
                  - text: )
                - listitem [ref=f1e601]:
                  - link "Wikis" [ref=f1e602] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Wikis
                  - text: ","
                  - superscript [ref=f1e603]:
                    - link "[78]" [ref=f1e604] [cursor=pointer]:
                      - /url: "#cite_note-78"
                  - text: with some repositories consisting solely of wiki content. These include curated lists of recommended software which have become known as awesome lists.
                  - superscript [ref=f1e605]:
                    - link "[79]" [ref=f1e606] [cursor=pointer]:
                      - /url: "#cite_note-79"
                  - superscript [ref=f1e607]:
                    - link "[80]" [ref=f1e608] [cursor=pointer]:
                      - /url: "#cite_note-80"
                - listitem [ref=f1e609]:
                  - link "GitHub Codespaces" [ref=f1e610] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/GitHub_Codespaces
                  - text: ", an"
                  - link "online IDE" [ref=f1e611] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Online_IDE
                  - text: providing users with a virtual machine intended to be a work environment to build and test code
                  - superscript [ref=f1e612]:
                    - link "[81]" [ref=f1e613] [cursor=pointer]:
                      - /url: "#cite_note-81"
                  - superscript [ref=f1e614]:
                    - link "[82]" [ref=f1e615] [cursor=pointer]:
                      - /url: "#cite_note-82"
                  - superscript [ref=f1e616]:
                    - link "[83]" [ref=f1e617] [cursor=pointer]:
                      - /url: "#cite_note-83"
                - listitem [ref=f1e618]: "Graphs: pulse, contributors, commits, code frequency, punch card, network, members"
                - listitem [ref=f1e619]:
                  - text: Integrations Directory
                  - superscript [ref=f1e620]:
                    - link "[84]" [ref=f1e621] [cursor=pointer]:
                      - /url: "#cite_note-84"
                - listitem [ref=f1e622]:
                  - text: Email notifications
                  - superscript [ref=f1e623]:
                    - link "[85]" [ref=f1e624] [cursor=pointer]:
                      - /url: "#cite_note-85"
                - listitem [ref=f1e625]:
                  - text: Discussions
                  - superscript [ref=f1e626]:
                    - link "[86]" [ref=f1e627] [cursor=pointer]:
                      - /url: "#cite_note-86"
                - listitem [ref=f1e628]:
                  - text: Option to subscribe someone to notifications by
                  - link "@ mentioning" [ref=f1e629] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mention_(blogging)
                  - text: them.
                  - superscript [ref=f1e630]:
                    - link "[87]" [ref=f1e631] [cursor=pointer]:
                      - /url: "#cite_note-87"
                - listitem [ref=f1e632]:
                  - link "Emojis" [ref=f1e633] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Emoji
                  - superscript [ref=f1e634]:
                    - link "[88]" [ref=f1e635] [cursor=pointer]:
                      - /url: "#cite_note-88"
                - listitem [ref=f1e636]:
                  - text: Nested
                  - link "task-lists" [ref=f1e637] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/To_do_list
                  - text: within files
                - listitem [ref=f1e638]:
                  - text: Visualization of
                  - link "geospatial" [ref=f1e639] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Geospatial_analysis
                  - text: data
                - listitem [ref=f1e640]:
                  - text: 3D render files can be previewed using an integrated STL file viewer that displays the files on a "3D canvas."
                  - superscript [ref=f1e641]:
                    - link "[89]" [ref=f1e642] [cursor=pointer]:
                      - /url: "#cite_note-3d-89"
                  - text: The viewer is powered by
                  - link "WebGL" [ref=f1e643] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/WebGL
                  - text: and
                  - link "Three.js" [ref=f1e644] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Three.js
                  - text: .
                - listitem [ref=f1e645]: Support for previewing many common image formats, including Photoshop's PSD files
                - listitem [ref=f1e646]: PDF document viewer
                - listitem [ref=f1e647]:
                  - text: Security Alerts of known
                  - link "Common Vulnerabilities and Exposures" [ref=f1e648] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Common_Vulnerabilities_and_Exposures
                  - text: in different packages
              - paragraph [ref=f1e649]:
                - text: GitHub's Terms of Service do not require public software projects hosted on GitHub to meet the
                - link "Open Source Definition" [ref=f1e650] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Open_Source_Definition
                - text: . The
                - link "terms of service" [ref=f1e651] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Terms_of_service
                - text: state, "By setting your repositories to be viewed publicly, you agree to allow others to view and fork your repositories."
                - superscript [ref=f1e652]:
                  - link "[90]" [ref=f1e653] [cursor=pointer]:
                    - /url: "#cite_note-90"
            - region [ref=f1e654]:
              - generic [ref=f1e655]:
                - heading "GitHub Enterprise" [level=3] [ref=f1e656]
                - generic [ref=f1e657]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=10
              - paragraph [ref=f1e658]:
                - text: GitHub Enterprise is a self-managed version of GitHub with similar functionality. It can be run on an organization's hardware or a cloud provider and has been available as of November 2011.
                - superscript [ref=f1e659]:
                  - link "[91]" [ref=f1e660] [cursor=pointer]:
                    - /url: "#cite_note-91"
                - text: In November 2020, source code for GitHub Enterprise Server was leaked online in an apparent protest against DMCA takedown of
                - link "youtube-dl" [ref=f1e661] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Youtube-dl
                - text: . According to GitHub, the source code came from GitHub accidentally sharing the code with Enterprise customers themselves, not from an attack on GitHub servers.
                - superscript [ref=f1e662]:
                  - link "[92]" [ref=f1e663] [cursor=pointer]:
                    - /url: "#cite_note-92"
                - superscript [ref=f1e664]:
                  - link "[93]" [ref=f1e665] [cursor=pointer]:
                    - /url: "#cite_note-93"
            - region [ref=f1e666]:
              - generic [ref=f1e667]:
                - heading "GitHub Pages" [level=3] [ref=f1e668]
                - generic [ref=f1e669]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=11
              - paragraph [ref=f1e670]:
                - text: In 2008, GitHub introduced GitHub Pages, a
                - link "static" [ref=f1e671] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Static_web_page
                - link "web hosting service" [ref=f1e672] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_hosting_service
                - text: for
                - link "blogs" [ref=f1e673] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Blog
                - text: ", project documentation,"
                - superscript [ref=f1e674]:
                  - link "[94]" [ref=f1e675] [cursor=pointer]:
                    - /url: "#cite_note-94"
                - superscript [ref=f1e676]:
                  - link "[95]" [ref=f1e677] [cursor=pointer]:
                    - /url: "#cite_note-95"
                - text: and books.
                - superscript [ref=f1e678]:
                  - link "[96]" [ref=f1e679] [cursor=pointer]:
                    - /url: "#cite_note-96"
                - text: All GitHub Pages content is stored in a Git repository as files served to visitors verbatim or in
                - link "Markdown" [ref=f1e680] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GitHub_Flavored_Markdown
                - text: format. GitHub is integrated with the
                - link "Jekyll" [ref=f1e681] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jekyll_(software)
                - text: static website and blog generator and GitHub continuous integration pipelines. Each time the content source is updated, Jekyll regenerates the website and automatically serves it via GitHub Pages infrastructure.
                - superscript [ref=f1e682]:
                  - link "[97]" [ref=f1e683] [cursor=pointer]:
                    - /url: "#cite_note-97"
              - paragraph [ref=f1e684]:
                - text: Like the rest of GitHub, it includes free and paid service tiers. Websites generated through this service are hosted either as
                - link "subdomains" [ref=f1e685] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Subdomain
                - text: of the github.io domain or can be connected to custom
                - link "domains" [ref=f1e686] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Domain_name
                - text: bought through a third-party
                - link "domain name registrar" [ref=f1e687] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Domain_name_registrar
                - text: .
                - superscript [ref=f1e688]:
                  - link "[98]" [ref=f1e689] [cursor=pointer]:
                    - /url: "#cite_note-98"
                - text: GitHub Pages supports HTTPS encryption.
                - superscript [ref=f1e690]:
                  - link "[99]" [ref=f1e691] [cursor=pointer]:
                    - /url: "#cite_note-99"
                - superscript [ref=f1e692]:
                  - link "[100]" [ref=f1e693] [cursor=pointer]:
                    - /url: "#cite_note-100"
            - region [ref=f1e694]:
              - generic [ref=f1e695]:
                - heading "GitHub Actions" [level=3] [ref=f1e696]
                - generic [ref=f1e697]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=12
              - paragraph [ref=f1e698]:
                - text: GitHub Actions was officially launched on November 13, 2019. It was first announced in October 2018 at GitHub Universe as a way to automate workflows, but the full general availability (GA) release came a year later in 2019. GitHub Actions,
                - superscript [ref=f1e699]:
                  - link "[101]" [ref=f1e700] [cursor=pointer]:
                    - /url: "#cite_note-101"
                - text: which allows building
                - link "continuous integration" [ref=f1e701] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Continuous_integration
                - text: and
                - link "continuous deployment" [ref=f1e702] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Continuous_deployment
                - text: pipelines for testing, releasing and deploying software without the use of third-party websites/platforms. Unlike many other CI/CD tools, GitHub Actions launched with a marketplace where developers could share and reuse prebuilt actions (e.g., testing, linting, deployments). GitHub wanted to reduce reliance on third-party services and keep developers within the GitHub ecosystem. GitHub Actions provided hosted runners (Linux, Windows, macOS) that could dynamically scale, eliminating the need for self-managed build servers.
            - region [ref=f1e703]:
              - generic [ref=f1e704]:
                - heading "Gist" [level=3] [ref=f1e705]
                - generic [ref=f1e706]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=13
              - paragraph [ref=f1e707]:
                - text: GitHub also operates a
                - link "pastebin" [ref=f1e708] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pastebin
                - text: "-style site called Gist, which is for"
                - link "code snippets" [ref=f1e709] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Snippet_(programming)
                - text: ", as opposed to GitHub proper, which is usually used for larger projects."
                - superscript [ref=f1e710]:
                  - link "[15]" [ref=f1e711] [cursor=pointer]:
                    - /url: "#cite_note-pastie-15"
                - text: Tom Preston-Werner débuted the feature at a Ruby conference in 2008.
                - superscript [ref=f1e712]:
                  - link "[102]" [ref=f1e713] [cursor=pointer]:
                    - /url: "#cite_note-102"
              - paragraph [ref=f1e714]:
                - text: Gist builds on the traditional simple concept of a
                - link "pastebin" [ref=f1e715] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pastebin
                - text: by adding version control for code snippets, easy forking, and
                - link "TLS encryption" [ref=f1e716] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Transport_Layer_Security
                - text: for private pastes. Because each "gist" is its own Git repository, multiple code snippets can be contained in a single page, and they can be pushed and pulled using Git.
                - superscript [ref=f1e717]:
                  - link "[103]" [ref=f1e718] [cursor=pointer]:
                    - /url: "#cite_note-103"
              - paragraph [ref=f1e719]:
                - text: Unregistered users could upload Gists until March 19, 2018, when uploading Gists was restricted to logged-in users, reportedly to mitigate
                - link "spamming" [ref=f1e720] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Spamming
                - text: on the page of recent Gists.
                - superscript [ref=f1e721]:
                  - link "[104]" [ref=f1e722] [cursor=pointer]:
                    - /url: "#cite_note-104"
              - paragraph [ref=f1e723]:
                - text: Gists'
                - link "URLs" [ref=f1e724] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/URL
                - text: use hexadecimal IDs, and edits to Gists are recorded in a
                - link "revision history" [ref=f1e725] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Version_control
                - text: ", which can show the text difference of thirty revisions per page with an option between a \"split\" and \"unified\" view. Like repositories, Gists can be forked, \"starred\", i.e., publicly bookmarked, and commented on. The count of revisions, stars, and forks is indicated on the gist page."
                - superscript [ref=f1e726]:
                  - link "[105]" [ref=f1e727] [cursor=pointer]:
                    - /url: "#cite_note-105"
            - region [ref=f1e728]:
              - generic [ref=f1e729]:
                - heading "Education program" [level=3] [ref=f1e730]
                - generic [ref=f1e731]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=14
              - paragraph [ref=f1e732]:
                - text: GitHub launched a new program called the GitHub Student Developer Pack to give students free access to more than a dozen popular development tools and services. GitHub partnered with
                - link "Bitnami" [ref=f1e733] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bitnami
                - text: ","
                - link "Crowdflower" [ref=f1e734] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crowdflower
                - text: ","
                - link "DigitalOcean" [ref=f1e735] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/DigitalOcean
                - text: ", DNSimple,"
                - link "HackHands" [ref=f1e736] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/HackHands
                - text: ","
                - link "Namecheap" [ref=f1e737] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Namecheap
                - text: ", Orchestrate, Screen hero,"
                - link "SendGrid" [ref=f1e738] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SendGrid
                - text: ","
                - link "Stripe" [ref=f1e739] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stripe_(company)
                - text: ","
                - link "Travis CI" [ref=f1e740] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Travis_CI
                - text: ", and"
                - link "Unreal Engine" [ref=f1e741] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Unreal_Engine
                - text: to launch the program.
                - superscript [ref=f1e742]:
                  - link "[106]" [ref=f1e743] [cursor=pointer]:
                    - /url: "#cite_note-106"
              - paragraph [ref=f1e744]:
                - text: In 2016, GitHub announced the launch of the GitHub Campus Experts program
                - superscript [ref=f1e745]:
                  - link "[107]" [ref=f1e746] [cursor=pointer]:
                    - /url: "#cite_note-107"
                - text: to train and encourage students to grow technology communities at their universities. The Campus Experts program is open to university students 18 years and older worldwide.
                - superscript [ref=f1e747]:
                  - link "[108]" [ref=f1e748] [cursor=pointer]:
                    - /url: "#cite_note-108"
                - text: GitHub Campus Experts are one of the primary ways that GitHub funds student-oriented events and communities, Campus Experts are given access to training, funding, and additional resources to run events and grow their communities. To become a Campus Expert, applicants must complete an online training course with multiple modules to develop community leadership skills.
            - region [ref=f1e749]:
              - generic [ref=f1e750]:
                - heading "GitHub Marketplace service" [level=3] [ref=f1e751]
                - generic [ref=f1e752]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=15
              - paragraph [ref=f1e753]:
                - text: GitHub also provides some
                - link "software as a service" [ref=f1e754] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Software_as_a_service
                - text: "(SaaS) integrations for adding extra features to projects. Those services include:"
              - list [ref=f1e755]:
                - listitem [ref=f1e756]:
                  - text: "Waffle.io: project management for software teams, which allows users to automatically see pull requests, automated builds, reviews, and deployments across repositories."
                  - superscript [ref=f1e757]:
                    - link "[109]" [ref=f1e758] [cursor=pointer]:
                      - /url: "#cite_note-109"
                - listitem [ref=f1e759]:
                  - text: "Rollbar: provides real-time debugging tools and full-stack exception reporting."
                  - superscript [ref=f1e760]:
                    - link "[110]" [ref=f1e761] [cursor=pointer]:
                      - /url: "#cite_note-110"
                  - superscript [ref=f1e762]:
                    - link "[111]" [ref=f1e763] [cursor=pointer]:
                      - /url: "#cite_note-111"
                - listitem [ref=f1e764]:
                  - link "Travis CI" [ref=f1e765] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Travis_CI
                  - text: ":"
                  - link "continuous integration" [ref=f1e766] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Continuous_integration
                  - text: service.
                  - superscript [ref=f1e767]:
                    - link "[112]" [ref=f1e768] [cursor=pointer]:
                      - /url: "#cite_note-112"
                - listitem [ref=f1e769]:
                  - text: "GitLocalize: provides utilities to manage project translation and internationalization."
                  - superscript [ref=f1e770]:
                    - link "[113]" [ref=f1e771] [cursor=pointer]:
                      - /url: "#cite_note-113"
            - region [ref=f1e772]:
              - generic [ref=f1e773]:
                - heading "GitHub Mobile" [level=3] [ref=f1e774]
                - generic [ref=f1e775]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=16
              - paragraph [ref=f1e776]:
                - text: In 2019, GitHub officially launched its native mobile applications for both iOS and Android.
                - superscript [ref=f1e777]:
                  - link "[114]" [ref=f1e778] [cursor=pointer]:
                    - /url: "#cite_note-114"
                - text: This announcement was made during GitHub Universe 2019, with the apps being released in beta for iOS initially, followed by an Android beta and full public release in early 2020.
                - superscript [ref=f1e779]:
                  - link "[115]" [ref=f1e780] [cursor=pointer]:
                    - /url: "#cite_note-115"
            - region [ref=f1e781]:
              - generic [ref=f1e782]:
                - heading "GitHub Sponsors" [level=3] [ref=f1e783]
                - generic [ref=f1e784]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=17
              - paragraph [ref=f1e785]:
                - text: GitHub Sponsors allows users to make monthly money donations to projects hosted on GitHub.
                - superscript [ref=f1e786]:
                  - link "[116]" [ref=f1e787] [cursor=pointer]:
                    - /url: "#cite_note-116"
                - text: The public beta was announced on May 23, 2019, and the project accepts waitlist registrations.
                - link "The Verge" [ref=f1e788] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Verge
                - text: said that GitHub Sponsors "works exactly like
                - link "Patreon" [ref=f1e789] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Patreon
                - text: "\" because \"developers can offer various funding tiers that come with different perks, and they'll receive recurring payments from supporters who want to access them and encourage their work\" except with \"zero fees to use the program.\" Furthermore, GitHub offers incentives for early adopters during the first year: it pledges to cover payment processing costs and match sponsorship payments up to $5,000 per developer. Furthermore, users can still use similar services like Patreon and Open Collective and link to their websites."
                - superscript [ref=f1e790]:
                  - link "[117]" [ref=f1e791] [cursor=pointer]:
                    - /url: "#cite_note-117"
                - superscript [ref=f1e792]:
                  - link "[118]" [ref=f1e793] [cursor=pointer]:
                    - /url: "#cite_note-118"
          - region [ref=f1e794]:
            - generic [ref=f1e795]:
              - heading "GitHub Copilot" [level=2] [ref=f1e796]
              - generic [ref=f1e797]:
                - link "edit":
                  - /url: /w/index.php?title=GitHub&action=edit&section=18
            - note [ref=f1e798]:
              - text: "Main article:"
              - link "GitHub Copilot" [ref=f1e799] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GitHub_Copilot
            - figure [ref=f1e800]:
              - link [ref=f1e801] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:GitHub_Codespaces_side_by_side_terminal.webp
              - generic [ref=f1e803]:
                - link "GitHub Codespaces" [ref=f1e804] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GitHub_Codespaces
                - text: layout
                - link "GitHub Copilot" [ref=f1e805] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GitHub_Copilot
                - text: on the left Code editor in center Terminal on the right
            - paragraph [ref=f1e806]:
              - text: GitHub Copilot was one of the first widely adopted
              - link "AI" [ref=f1e807] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/AI
              - text: "-assisted software development tools. The preview launched in 2021 for"
              - link "VSCode" [ref=f1e808] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/VSCode
              - text: users and was based on
              - link "OpenAI" [ref=f1e809] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/OpenAI
              - text: "'s Codex model."
              - superscript [ref=f1e810]:
                - link "[119]" [ref=f1e811] [cursor=pointer]:
                  - /url: "#cite_note-119"
            - paragraph [ref=f1e812]:
              - text: GitHub Copilot is now available to use on GitHub.com directly, on the
              - link "command line" [ref=f1e813] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Command_line
              - text: ", as well as in several"
              - link "IDEs" [ref=f1e814] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Integrated_development_environment
              - text: . Users are able to choose from a range of
              - link "LLMs" [ref=f1e815] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/LLM
              - text: for some features.
            - paragraph [ref=f1e816]:
              - text: "User requests to block the Copilot features have been the #1 and #2 most popular topics of the past 12 months on GitHub's organization community page as of September 2025. The topics remain unanswered. Some users and projects have moved to"
              - link "open source" [ref=f1e817] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Open_source
              - text: alternatives such as
              - link "Codeberg" [ref=f1e818] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Codeberg
              - text: .
              - superscript [ref=f1e819]:
                - link "[120]" [ref=f1e820] [cursor=pointer]:
                  - /url: "#cite_note-120"
            - paragraph [ref=f1e821]: Agentic Workflows
            - paragraph [ref=f1e822]:
              - text: GitHub Agentic Workflows are a system from the GitHub Next team that allows developers to create automated tasks powered by AI, while maintaining strict security guardrails. Unlike traditional automation, you define the workflow using natural language prompts, and the system executes these as agents with a constrained, secure toolset.
              - superscript [ref=f1e823]:
                - link "[121]" [ref=f1e824] [cursor=pointer]:
                  - /url: "#cite_note-121"
            - paragraph [ref=f1e825]: Crucially, these agents cannot perform arbitrary actions; they emit intent (a structured request) that is processed by a highly secure, restricted handler that ensures only authorized actions are executed.
          - region [ref=f1e826]:
            - generic [ref=f1e827]:
              - heading "GitHub Archive Program" [level=2] [ref=f1e828]
              - generic [ref=f1e829]:
                - link "edit":
                  - /url: /w/index.php?title=GitHub&action=edit&section=19
            - note [ref=f1e830]:
              - text: "Main article:"
              - link "GitHub Archive Program" [ref=f1e831] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GitHub_Archive_Program
            - paragraph [ref=f1e832]:
              - text: In July 2020, GitHub stored a February archive of the site
              - superscript [ref=f1e833]:
                - link "[64]" [ref=f1e834] [cursor=pointer]:
                  - /url: "#cite_note-blog-64"
              - text: in an abandoned mountain mine in
              - link "Svalbard" [ref=f1e835] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Svalbard
              - text: ", Norway, part of the"
              - link "Arctic World Archive" [ref=f1e836] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Arctic_World_Archive
              - text: and not far from the
              - link "Svalbard Global Seed Vault" [ref=f1e837] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Svalbard_Global_Seed_Vault
              - text: . The archive contained the code of all active public repositories, as well as that of dormant but significant public repositories. The 21
              - link "TB" [ref=f1e838] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Terabyte
              - text: of data was stored on piqlFilm archival film reels as
              - link "matrix (2D) barcode" [ref=f1e839] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Barcode#Matrix_(2D)_barcodes
              - text: (
              - link "Boxing barcode" [ref=f1e840] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Boxing_barcode
              - text: ), and is expected to last 500–1,000 years.
              - superscript [ref=f1e841]:
                - link "[122]" [ref=f1e842] [cursor=pointer]:
                  - /url: "#cite_note-122"
              - superscript [ref=f1e843]:
                - link "[123]" [ref=f1e844] [cursor=pointer]:
                  - /url: "#cite_note-123"
              - superscript [ref=f1e845]:
                - link "[124]" [ref=f1e846] [cursor=pointer]:
                  - /url: "#cite_note-124"
              - superscript [ref=f1e847]:
                - link "[125]" [ref=f1e848] [cursor=pointer]:
                  - /url: "#cite_note-buried-125"
            - paragraph [ref=f1e849]:
              - text: The GitHub Archive Program is also working with partners on Project Silica, in an attempt to store all public repositories for 10,000 years. It aims to write archives into the molecular structure of
              - link "quartz glass" [ref=f1e850] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Quartz_glass
              - text: platters, using a high-precision
              - link "petahertz" [ref=f1e851] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Petahertz
              - text: pulse laser, i.e. one that pulses a
              - link "quadrillion" [ref=f1e852] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Quadrillion
              - text: (1,000,000,000,000,000) times per second.
              - superscript [ref=f1e853]:
                - link "[125]" [ref=f1e854] [cursor=pointer]:
                  - /url: "#cite_note-buried-125"
          - region [ref=f1e855]:
            - generic [ref=f1e856]:
              - heading "Controversies" [level=2] [ref=f1e857]
              - generic [ref=f1e858]:
                - link "edit":
                  - /url: /w/index.php?title=GitHub&action=edit&section=20
            - region [ref=f1e859]:
              - generic [ref=f1e860]:
                - heading "Harassment allegations" [level=3] [ref=f1e861]
                - generic [ref=f1e862]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=21
              - paragraph [ref=f1e863]:
                - text: In March 2014, GitHub programmer Julie Ann Horvath alleged that founder and CEO Tom Preston-Werner engaged in a pattern of
                - link "harassment" [ref=f1e864] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Harassment
                - text: against her that led to her leaving the company.
                - superscript [ref=f1e865]:
                  - link "[126]" [ref=f1e866] [cursor=pointer]:
                    - /url: "#cite_note-Valleywag_March_2014-126"
                - text: In April 2014, GitHub released a statement denying Horvath's allegations.
                - superscript [ref=f1e867]:
                  - link "[127]" [ref=f1e868] [cursor=pointer]:
                    - /url: "#cite_note-127"
                - superscript [ref=f1e869]:
                  - link "[128]" [ref=f1e870] [cursor=pointer]:
                    - /url: "#cite_note-NYTResigns-128"
                - superscript [ref=f1e871]:
                  - link "[129]" [ref=f1e872] [cursor=pointer]:
                    - /url: "#cite_note-129"
                - text: However, following an internal investigation, GitHub confirmed the claims. GitHub's CEO Chris Wanstrath wrote on the company blog, "The investigation found Tom Preston-Werner in his capacity as GitHub's CEO acted inappropriately, including confrontational conduct, disregard of workplace complaints, insensitivity to the impact of his spouse's presence in the workplace, and failure to enforce an agreement that his spouse should not work in the office."
                - superscript [ref=f1e873]:
                  - link "[130]" [ref=f1e874] [cursor=pointer]:
                    - /url: "#cite_note-Follow_up_to_the_investigation_results-130"
                - text: Preston-Werner subsequently resigned from the company.
                - superscript [ref=f1e875]:
                  - link "[131]" [ref=f1e876] [cursor=pointer]:
                    - /url: "#cite_note-:0-131"
                - text: The firm then announced it would implement new initiatives and trainings "to make sure employee concerns and conflicts are taken seriously and dealt with appropriately."
                - superscript [ref=f1e877]:
                  - link "[131]" [ref=f1e878] [cursor=pointer]:
                    - /url: "#cite_note-:0-131"
            - region [ref=f1e879]:
              - generic [ref=f1e880]:
                - heading "Sanctions" [level=3] [ref=f1e881]
                - generic [ref=f1e882]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=22
              - paragraph [ref=f1e883]:
                - text: On July 25, 2019, a developer based in Iran wrote on
                - link "Medium" [ref=f1e884] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Medium_(website)
                - text: that GitHub had blocked his private repositories and prohibited access to GitHub pages.
                - superscript [ref=f1e885]:
                  - link "[132]" [ref=f1e886] [cursor=pointer]:
                    - /url: "#cite_note-132"
                - text: Soon after, GitHub confirmed that it was now blocking developers in
                - link "Iran" [ref=f1e887] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iran
                - text: ","
                - link "Crimea" [ref=f1e888] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crimea
                - text: ","
                - link "Cuba" [ref=f1e889] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cuba
                - text: ","
                - link "North Korea" [ref=f1e890] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/North_Korea
                - text: ", and"
                - link "Syria" [ref=f1e891] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Syria
                - text: from accessing private repositories.
                - superscript [ref=f1e892]:
                  - link "[133]" [ref=f1e893] [cursor=pointer]:
                    - /url: "#cite_note-133"
                - text: "However, GitHub reopened access to GitHub Pages days later, for public repositories regardless of location. It was also revealed that using GitHub while visiting sanctioned countries could result in similar actions occurring on a user's account. GitHub responded to complaints and the media through a spokesperson, saying:"
              - blockquote [ref=f1e894]:
                - paragraph [ref=f1e895]:
                  - text: GitHub is subject to US trade control laws, and is committed to full compliance with applicable law. At the same time, GitHub's vision is to be the global platform for
                  - link "developer" [ref=f1e896] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Developer_(software)
                  - text: collaboration, no matter where developers reside. As a result, we take seriously our responsibility to examine government mandates thoroughly to be certain that users and customers are not impacted beyond what is required by law. This includes keeping public repositories services, including those for open source projects, available and accessible to support personal communications involving developers in sanctioned regions.
                  - superscript [ref=f1e897]:
                    - link "[134]" [ref=f1e898] [cursor=pointer]:
                      - /url: "#cite_note-134"
                  - superscript [ref=f1e899]:
                    - link "[135]" [ref=f1e900] [cursor=pointer]:
                      - /url: "#cite_note-135"
              - paragraph [ref=f1e901]:
                - text: Developers who feel that they should not have restrictions can appeal for the removal of said restrictions, including those who only travel to, and do not reside in, those countries. GitHub has forbidden the use of
                - link "VPNs" [ref=f1e902] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Virtual_private_network
                - text: and
                - link "IP proxies" [ref=f1e903] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Proxy_server
                - text: to access the site from sanctioned countries, as purchase history and IP addresses are how it flags users, among other sources.
                - superscript [ref=f1e904]:
                  - link "[136]" [ref=f1e905] [cursor=pointer]:
                    - /url: "#cite_note-136"
            - region [ref=f1e906]:
              - generic [ref=f1e907]:
                - heading "Censorship" [level=3] [ref=f1e908]
                - generic [ref=f1e909]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=23
              - note [ref=f1e910]:
                - text: "Main article:"
                - link "Censorship of GitHub" [ref=f1e911] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Censorship_of_GitHub
              - paragraph [ref=f1e912]:
                - text: On December 4, 2014, Russia blacklisted GitHub.com because GitHub initially refused to take down user-posted suicide manuals.
                - superscript [ref=f1e913]:
                  - link "[137]" [ref=f1e914] [cursor=pointer]:
                    - /url: "#cite_note-137"
                - text: After a day, Russia withdrew its block,
                - superscript [ref=f1e915]:
                  - link "[138]" [ref=f1e916] [cursor=pointer]:
                    - /url: "#cite_note-138"
                - text: and GitHub began blocking specific content and pages in Russia.
                - superscript [ref=f1e917]:
                  - link "[139]" [ref=f1e918] [cursor=pointer]:
                    - /url: "#cite_note-139"
                - text: On December 31, 2014, India blocked GitHub.com along with 31 other websites over pro-
                - link "ISIS" [ref=f1e919] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ISIS
                - text: content posted by users;
                - superscript [ref=f1e920]:
                  - link "[140]" [ref=f1e921] [cursor=pointer]:
                    - /url: "#cite_note-140"
                - text: the block was lifted three days later.
                - superscript [ref=f1e922]:
                  - link "[141]" [ref=f1e923] [cursor=pointer]:
                    - /url: "#cite_note-141"
                - text: On October 8, 2016, Turkey blocked GitHub to prevent email leakage of a hacked account belonging to the country's energy minister.
                - superscript [ref=f1e924]:
                  - link "[142]" [ref=f1e925] [cursor=pointer]:
                    - /url: "#cite_note-142"
              - paragraph [ref=f1e926]:
                - text: On March 26, 2015, a large-scale
                - link "DDoS" [ref=f1e927] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/DDoS
                - text: attack was launched against GitHub.com that lasted for just under five days.
                - superscript [ref=f1e928]:
                  - link "[143]" [ref=f1e929] [cursor=pointer]:
                    - /url: "#cite_note-143"
                - text: The attack, which appeared to originate from China, primarily targeted GitHub-hosted user content describing methods of
                - link "circumventing Internet censorship" [ref=f1e930] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Internet_censorship_circumvention
                - text: .
                - superscript [ref=f1e931]:
                  - link "[144]" [ref=f1e932] [cursor=pointer]:
                    - /url: "#cite_note-144"
                - superscript [ref=f1e933]:
                  - link "[145]" [ref=f1e934] [cursor=pointer]:
                    - /url: "#cite_note-145"
                - superscript [ref=f1e935]:
                  - link "[146]" [ref=f1e936] [cursor=pointer]:
                    - /url: "#cite_note-146"
              - paragraph [ref=f1e937]:
                - text: On April 19, 2020, Chinese police detained Chen Mei and Cai Wei (volunteers for Terminus 2049, a project hosted on GitHub), and accused them of "picking quarrels and provoking trouble." Cai and Chen archived news articles, interviews, and other materials published on Chinese media outlets and social media platforms that have been removed by censors in China.
                - superscript [ref=f1e938]:
                  - link "[147]" [ref=f1e939] [cursor=pointer]:
                    - /url: "#cite_note-147"
            - region [ref=f1e940]:
              - generic [ref=f1e941]:
                - heading "ICE contract" [level=3] [ref=f1e942]
                - generic [ref=f1e943]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=24
              - note [ref=f1e944]:
                - text: "See also:"
                - link "Microsoft and unions § United States" [ref=f1e945] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_and_unions#United_States
              - paragraph [ref=f1e946]:
                - text: GitHub has a $200,000 contract with
                - link "U.S. Immigration and Customs Enforcement" [ref=f1e947] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/U.S._Immigration_and_Customs_Enforcement
                - text: (ICE) for the use of their on-site product GitHub Enterprise Server. This contract was renewed in 2019, despite internal opposition from many GitHub employees. In an email sent to employees, later posted to the GitHub blog on October 9, 2019, CEO
                - link "Nat Friedman" [ref=f1e948] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nat_Friedman
                - text: stated, "The revenue from the purchase is less than $200,000 and not financially material for our company." He announced that GitHub had pledged to donate $500,000 to "nonprofit groups supporting immigrant communities targeted by
                - link "the current administration" [ref=f1e949] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First_presidency_of_Donald_Trump
                - text: ."
                - superscript [ref=f1e950]:
                  - link "[148]" [ref=f1e951] [cursor=pointer]:
                    - /url: "#cite_note-148"
                - text: In response, at least 150 GitHub employees signed an open letter re-stating their opposition to the contract, and denouncing alleged human rights abuses by ICE. As of November 13, 2019, five workers had resigned over the contract.
                - superscript [ref=f1e952]:
                  - link "[149]" [ref=f1e953] [cursor=pointer]:
                    - /url: "#cite_note-149"
                - superscript [ref=f1e954]:
                  - link "[150]" [ref=f1e955] [cursor=pointer]:
                    - /url: "#cite_note-150"
                - superscript [ref=f1e956]:
                  - link "[151]" [ref=f1e957] [cursor=pointer]:
                    - /url: "#cite_note-151"
              - paragraph [ref=f1e958]:
                - text: The ICE contract dispute came into focus again in June 2020 due to the company's decision
                - link "to abandon \"master/slave\" branch terminology" [ref=f1e959] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Master–slave_(technology)#Controversy
                - text: ", spurred by the George Floyd protests and"
                - link "Black Lives Matter" [ref=f1e960] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Black_Lives_Matter
                - text: movement.
                - superscript [ref=f1e961]:
                  - link "[152]" [ref=f1e962] [cursor=pointer]:
                    - /url: "#cite_note-152"
                - text: Detractors of GitHub describe the branch renaming to be a form of
                - link "performative activism" [ref=f1e963] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Performative_activism
                - text: and have urged GitHub to cancel its ICE contract instead.
                - superscript [ref=f1e964]:
                  - link "[153]" [ref=f1e965] [cursor=pointer]:
                    - /url: "#cite_note-153"
                - text: An open letter from members of the open source community was shared on GitHub in December 2019, demanding that the company drop its contract with ICE and provide more transparency into how it conducts business and partnerships. The letter has been signed by more than 700 people.
                - superscript [ref=f1e966]:
                  - link "[154]" [ref=f1e967] [cursor=pointer]:
                    - /url: "#cite_note-154"
            - region [ref=f1e968]:
              - generic [ref=f1e969]:
                - heading "Capitol riot comments and employee firing" [level=3] [ref=f1e970]
                - generic [ref=f1e971]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=25
              - paragraph [ref=f1e972]:
                - text: In January 2021, GitHub fired one of its employees after he expressed concern for colleagues following the
                - link "January 6 United States Capitol attack" [ref=f1e973] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/January_6_United_States_Capitol_attack
                - text: ", calling some of the rioters \""
                - link "Nazis" [ref=f1e974] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Neo-Nazism
                - text: "\"."
                - superscript [ref=f1e975]:
                  - link "[155]" [ref=f1e976] [cursor=pointer]:
                    - /url: "#cite_note-155"
                - text: After an investigation, GitHub's COO said there were "significant errors of judgment and procedure" with the company's decision to fire the employee. As a result of the investigation, GitHub reached out to the employee, and the company's head of human resources resigned.
                - superscript [ref=f1e977]:
                  - link "[156]" [ref=f1e978] [cursor=pointer]:
                    - /url: "#cite_note-156"
                - superscript [ref=f1e979]:
                  - link "[157]" [ref=f1e980] [cursor=pointer]:
                    - /url: "#cite_note-157"
            - region [ref=f1e981]:
              - generic [ref=f1e982]:
                - heading "Twitter source code leak" [level=3] [ref=f1e983]
                - generic [ref=f1e984]:
                  - link "edit":
                    - /url: /w/index.php?title=GitHub&action=edit&section=26
              - paragraph [ref=f1e985]:
                - text: In 2023, parts of the social media platform
                - link "Twitter" [ref=f1e986] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Twitter
                - text: were uploaded onto GitHub.
                - superscript [ref=f1e987]:
                  - link "[158]" [ref=f1e988] [cursor=pointer]:
                    - /url: "#cite_note-158"
                - text: The leak was first reported by the New York Times and was part of a legal filing Twitter submitted to the
                - link "United States District Court for the Northern District of California" [ref=f1e989] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_District_Court_for_the_Northern_District_of_California
                - text: . Twitter claimed that the postings infringed on copyright property owned by them, and asked the court for information to identify the user who posted the source code to GitHub, under the username "FreeSpeechEnthusiast".
                - superscript [ref=f1e990]:
                  - link "[159]" [ref=f1e991] [cursor=pointer]:
                    - /url: "#cite_note-159"
          - region [ref=f1e992]:
            - generic [ref=f1e993]:
              - heading "Reception" [level=2] [ref=f1e994]
              - generic [ref=f1e995]:
                - link "edit":
                  - /url: /w/index.php?title=GitHub&action=edit&section=27
            - paragraph [ref=f1e996]:
              - text: In 2012,
              - link "Linus Torvalds" [ref=f1e997] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Linus_Torvalds
              - text: ", the original developer of Git, highly praised GitHub, stating, \"The hosting of github ["
              - link "sic" [ref=f1e999] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sic
              - text: "] is excellent. They've done a good job on that. I think GitHub should be commended enormously for making open source project hosting so easy.\" However, he also sharply criticized the implementation of GitHub's merging interface, saying, \"Git comes with a nice pull-request generation module, but GitHub instead decided to replace it with its own totally inferior version. As a result, I consider GitHub useless for these kinds of things. It's fine for hosting, but the pull requests and the online commit editing, are just pure garbage.\""
