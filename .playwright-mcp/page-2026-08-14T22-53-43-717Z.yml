                    - /url: /w/index.php?title=GitHub&action=edit&section=7
              - paragraph [ref=f1e522]:
                - text: GitHub's
                - link "mascot" [ref=f1e523] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mascot
                - text: is Mona,
                - superscript [ref=f1e524]:
                  - link "[65]" [ref=f1e525] [cursor=pointer]:
                    - /url: "#cite_note-GitHub_Brand_Mascots-65"
                - text: an
                - link "anthropomorphized" [ref=f1e526] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthropomorphized
                - text: "\"octocat\" with five"
                - link "octopus-like arms" [ref=f1e527] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cephalopod_limb
                - text: .
                - superscript [ref=f1e528]:
                  - link "[66]" [ref=f1e529] [cursor=pointer]:
                    - /url: "#cite_note-Octodex_FAQ-66"
                - superscript [ref=f1e530]:
                  - link "[67]" [ref=f1e531] [cursor=pointer]:
                    - /url: "#cite_note-Jaramillo-67"
                - text: The character was created by graphic designer
                - link "Simon Oxley" [ref=f1e532] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Simon_Oxley
                - text: as
                - link "clip art" [ref=f1e533] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Clip_art
                - text: to sell on
                - link "iStock" [ref=f1e534] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IStock
                - text: ","
                - superscript [ref=f1e535]:
                  - link "[68]" [ref=f1e536] [cursor=pointer]:
                    - /url: "#cite_note-DeAmicis-68"
                - text: a website that enables designers to market
                - link "royalty-free" [ref=f1e537] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Royalty-free
                - link "digital images" [ref=f1e538] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Digital_image
                - text: . The illustration GitHub chose was a character that Oxley had named Octopuss.
                - superscript [ref=f1e539]:
