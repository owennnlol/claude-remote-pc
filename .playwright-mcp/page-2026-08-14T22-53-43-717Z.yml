                - text: ","
                - link "Windows Terminal" [ref=f1e445] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Windows_Terminal
                - text: and the bulk of its product documentation (now to be found on
                - link "Microsoft Docs" [ref=f1e446] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Learn
                - text: ).
                - superscript [ref=f1e447]:
                  - link "[44]" [ref=f1e448] [cursor=pointer]:
                    - /url: "#cite_note-venturebeat-44"
                - superscript [ref=f1e449]:
                  - link "[45]" [ref=f1e450] [cursor=pointer]:
                    - /url: "#cite_note-:1-45"
              - paragraph [ref=f1e451]:
                - text: On June 4, 2018, Microsoft announced its intent to acquire GitHub for US$7.5 billion (~$9.2 billion in 2024).
                - superscript [ref=f1e452]:
                  - link "[46]" [ref=f1e453] [cursor=pointer]:
                    - /url: "#cite_note-46"
                - text: The deal closed on October 26, 2018.
                - superscript [ref=f1e454]:
                  - link "[47]" [ref=f1e455] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - text: According to Microsoft, GitHub continued to operate independently as a community, platform and business.
                - superscript [ref=f1e456]:
                  - link "[48]" [ref=f1e457] [cursor=pointer]:
                    - /url: "#cite_note-48"
                - text: Under Microsoft, the service was led by
                - link "Xamarin" [ref=f1e458] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xamarin
                - text: "'s"
                - link "Nat Friedman" [ref=f1e459] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nat_Friedman
                - text: ", reporting to"
                - link "Scott Guthrie" [ref=f1e460] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Scott_Guthrie
                - text: ", executive vice president of Microsoft Cloud and AI."
                - superscript [ref=f1e461]:
                  - link "[49]" [ref=f1e462] [cursor=pointer]:
                    - /url: "#cite_note-49"
                - superscript [ref=f1e463]:
                  - link "[50]" [ref=f1e464] [cursor=pointer]:
                    - /url: "#cite_note-50"
              - paragraph [ref=f1e465]:
                - text: There have been concerns from developers Kyle Simpson,
                - link "JavaScript" [ref=f1e466] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/JavaScript
                - text: trainer and author, and Rafael Laguna, CEO at
                - link "Open-Xchange" [ref=f1e467] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Open-Xchange
                - text: over Microsoft's purchase, citing uneasiness over Microsoft's handling of previous acquisitions, such as
                - link "Nokia's mobile business" [ref=f1e468] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Mobile
                - text: and
                - link "Skype" [ref=f1e469] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Skype
                - text: .
                - superscript [ref=f1e470]:
                  - link "[51]" [ref=f1e471] [cursor=pointer]:
                    - /url: "#cite_note-51"
                - superscript [ref=f1e472]:
                  - link "[52]" [ref=f1e473] [cursor=pointer]:
                    - /url: "#cite_note-52"
              - paragraph [ref=f1e474]:
                - text: This acquisition was in line with Microsoft's business strategy under CEO
                - link "Satya Nadella" [ref=f1e475] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Satya_Nadella
                - text: ", which has seen a larger focus on"
                - link "cloud computing" [ref=f1e476] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cloud_computing
                - text: services, alongside the development of and contributions to open-source software.
                - superscript [ref=f1e477]:
                  - link "[10]" [ref=f1e478] [cursor=pointer]:
                    - /url: "#cite_note-techcrunch-10"
                - superscript [ref=f1e479]:
                  - link "[45]" [ref=f1e480] [cursor=pointer]:
                    - /url: "#cite_note-:1-45"
                - superscript [ref=f1e481]:
                  - link "[53]" [ref=f1e482] [cursor=pointer]:
                    - /url: "#cite_note-53"
                - link "Harvard Business Review" [ref=f1e484] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Harvard_Business_Review
                - text: argued that Microsoft was intending to acquire GitHub to get access to its user base, so it can be used as a
                - link "loss leader" [ref=f1e485] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Loss_leader
                - text: to encourage the use of its other development products and services.
                - superscript [ref=f1e486]:
                  - link "[54]" [ref=f1e487] [cursor=pointer]:
                    - /url: "#cite_note-54"
              - paragraph [ref=f1e488]:
                - text: "Concerns over the sale bolstered interest in competitors:"
                - link "Bitbucket" [ref=f1e489] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bitbucket
                - text: (owned by
                - link "Atlassian" [ref=f1e490] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Atlassian
                - text: ),
                - link "SourceForge" [ref=f1e491] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SourceForge
                - text: (owned by
                - link "Slashdot" [ref=f1e492] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Slashdot
                - text: ) and
                - link "GitLab" [ref=f1e493] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GitLab
                - text: reported that they had seen spikes in new users intending to migrate projects from GitHub to their respective services.
                - superscript [ref=f1e494]:
