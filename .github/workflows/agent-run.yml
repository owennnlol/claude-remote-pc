name: Agent Run (proof of concept)

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up virtual display, window manager, VNC, noVNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fluxbox x11vnc novnc websockify
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          fluxbox &
          x11vnc -display :99 -forever -shared -rfbport 5900 -passwd "$VNC_PASSWORD" &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Add a browser tool so Claude can act visibly on the virtual screen
        env:
          DISPLAY: ':99'
        run: |
          npx --yes playwright install --with-deps chromium
          cat > /tmp/playwright-mcp-config.json <<'EOF'
          {
            "browser": {
              "browserName": "chromium",
              "launchOptions": {
                "args": ["--disable-gpu"]
              }
            }
          }
          EOF
          npx --yes @playwright/mcp@latest --port 8931 --config /tmp/playwright-mcp-config.json > /tmp/playwright-mcp.log 2>&1 &
          sleep 5
          claude mcp add --transport sse playwright http://localhost:8931/sse

      - name: Open public tunnels (screen view + control channel)
        run: |
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 > vnc_tunnel.log 2>&1 &
          ./cloudflared tunnel --url http://localhost:7777 > control_tunnel.log 2>&1 &
          sleep 8
          VNC_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' vnc_tunnel.log | head -n1)
          CONTROL_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' control_tunnel.log | head -n1)
          echo ">>> WATCH: $VNC_URL/vnc.html?autoconnect=true&resize=remote <<<"
          echo ">>> CONTROL: $CONTROL_URL <<<"
          cat > session.json <<EOF
          {"watch_url": "$VNC_URL/vnc.html?autoconnect=true&resize=remote", "control_url": "$CONTROL_URL", "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          git config user.name "agent-run-bot"
          git config user.email "actions@users.noreply.github.com"
          git add session.json
          git commit -m "Session started"
          git push

      - name: Start control server and wait (this is the persistent session)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
          DISPLAY: ':99'
        run: node scripts/control-server.js

      - name: Final safety-net commit
        run: |
          git config user.name "agent-run-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing left to commit"
          else
            git commit -m "Agent session output"
            git push
          fi
